user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

# 文件句柄限制
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    sendfile on; # 启用高效文件传输
    tcp_nopush on; # 优化大文件传输
    tcp_nodelay on; # 提升小数据包传输效率
    keepalive_timeout 65; # 保持连接时间    
    types_hash_max_size 2048; # MIME 类型哈希表大小

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # 日志配置
    ##
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # 开启日志缓冲，减少磁盘 I/O 压力
    access_log /var/log/nginx/access.log main buffer=512k flush=5s;

    ##
    # Gzip 压缩
    ##
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5; # 权衡压缩率和 CPU 消耗
    gzip_min_length 1k; # 1k 以上才压缩
    # 补全了缺失的 JS、CSS 类型
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    ##
    # 虚拟主机配置
    ##
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
    include /etc/nginx/conf.d/*/*.conf;
}